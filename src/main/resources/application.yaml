spring:
  application:
    name: hr-system-backend
  datasource:
    url: ${DB_URL}
    password: ${DB_PASSWORD}
    username: ${DB_USERNAME}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
jwt:
  secret:
    key: ${JWT_SECRECT_KEY}